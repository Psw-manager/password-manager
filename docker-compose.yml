version: '3.3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend  
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app          
      - /app/node_modules         
    ports:
      - "3000:3000"                
    environment:
      - NODE_ENV=development       
      - CHOKIDAR_USEPOLLING=true  
    command: npm run dev          

